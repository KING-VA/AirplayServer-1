name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Install Android SDK components
        run: |
          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-27" \
            "build-tools;28.0.3" \
            "cmake;3.10.2.4988404" \
            "ndk;21.4.7075529"

      # - uses: android-actions/setup-android@v3

      - name: Show files
        run: |
          pwd
          ls -la
          ls -la platforms/android/aps-sdk

      - name: Make scripts executable
        run: |
          chmod +x platforms/android/aps-sdk/gradlew
          chmod +x platforms/android/aps-sdk/build-publish-airplay-sdk.sh

      # - name: Remove generated files
      #   run: |
      #     find . -name ".externalNativeBuild" -type d -exec rm -rf {} +
      #     find . -name ".cxx" -type d -exec rm -rf {} +
      - name: Build
        shell: bash
        run: |
          ./platforms/android/aps-sdk/build-publish-airplay-sdk.sh

      - name: Collect AAR
        run: |
          mkdir -p output
          find platforms/android/aps-sdk -name "*.aar"
          cp platforms/android/aps-sdk/airplay/build/outputs/aar/*.aar output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_Android
          path: output
