name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 17 only for sdkmanager
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          sdkmanager --version

          yes | sdkmanager \
            "platforms;android-27" \
            "build-tools;28.0.3" \
            "cmake;3.6.4111459" \
            "ndk;21.4.7075529"

      # Switch back to Java 11 for Gradle 5.4.1
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Show files
        run: |
          pwd
          ls -la
          ls -la platforms/android/aps-sdk

      - name: Make scripts executable
        run: |
          chmod +x platforms/android/aps-sdk/gradlew
          chmod +x platforms/android/aps-sdk/build-publish-airplay-sdk.sh

      - name: Remove generated native files
        run: |
          find . -name ".externalNativeBuild" -type d -prune -exec rm -rf {} +
          find . -name ".cxx" -type d -prune -exec rm -rf {} +

      - name: Build
        shell: bash
        run: |
          ./platforms/android/aps-sdk/build-publish-airplay-sdk.sh

      - name: Collect AAR
        run: |
          mkdir -p output
          find platforms/android/aps-sdk -name "*.aar"
          cp platforms/android/aps-sdk/airplay/build/outputs/aar/*.aar output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_Android
          path: output
